name: Android

# Vérifie que l'appli Android compile, à chaque modification de android/ sur main ou devel (build de debug, sans
# clé de signature). La construction des releases est dans release.yml.
on:
  push:
    branches: [main, devel]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
