name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = version de l'image Docker (Dockerfile) ; 3.14 pour anticiper la suivante.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Inclut tests/test_catalog.py : toute modification de static/mountains.json est validée.
      - run: pytest -q

  frontend:
    name: Syntaxe JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check static/app.js

  docker:
    name: Build + healthcheck Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t summitfr:ci .
      - name: Démarrage et /healthz
        run: |
          docker run -d --name summitfr -p 8000:8000 summitfr:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs summitfr
          exit 1
