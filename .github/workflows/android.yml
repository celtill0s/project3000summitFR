name: Android

# Vérifie que l'appli Android compile, à chaque modification de android/ sur main ou devel (build de debug, sans
# clé de signature). La construction des releases est dans release.yml.
on:
  push:
    branches: [main, devel]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --console=plain
