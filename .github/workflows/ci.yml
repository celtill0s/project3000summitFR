name: CI

on:
  push:
    branches: [main, devel]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = version de l'image Docker (Dockerfile) ; 3.14 pour anticiper la suivante.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Inclut tests/test_catalog.py : toute modification de static/mountains.json est validée.
      - run: pytest -q

  frontend:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Pas de package.json : ESLint n'est qu'un outil de CI, le frontend n'a aucune dépendance npm.
      - run: npm install --no-save --no-package-lock eslint@9 globals
      # no-undef / no-unused-vars : attrape un import oublié ou une faute de frappe entre modules.
      - run: npx eslint

  docker:
    name: Build + healthcheck Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t summitfr:ci .
      - name: Démarrage et /healthz
        run: |
          docker run -d --name summitfr -p 8000:8000 summitfr:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 1
          done
          docker logs summitfr
          exit 1
